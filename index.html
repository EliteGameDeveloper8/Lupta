<!doctype html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Duel</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#10222b;--card:#1b3a47;--gold:#f6c343;--blue:#4aa3f0;--pur:#b04ae0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
h1,.h{font-family:"Lilita One","Trebuchet MS",sans-serif;font-weight:400;letter-spacing:.02em;margin:0}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.scr.on{display:flex}
button{font:inherit;cursor:pointer}
.btn{font-family:"Lilita One","Trebuchet MS",sans-serif;font-size:22px;padding:14px 28px;border:0;border-radius:14px;color:#2a1c00;background:var(--gold);box-shadow:0 5px 0 #a87d12;min-width:250px}
.btn.b{background:var(--blue);color:#06233d;box-shadow:0 5px 0 #25689f}
.btn.g{background:#37505b;color:#fff;box-shadow:0 5px 0 #243840}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.btn:disabled{opacity:.45}
#menu h1{font-size:clamp(44px,13vw,72px);color:var(--gold);text-shadow:0 4px 0 #7a5a08;line-height:1}
#menu .sub{color:#9fc0cc;max-width:300px;font-size:14px;line-height:1.4}
#stat{font-size:13px;color:#9fc0cc;min-height:18px}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid #2b4b59;border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
#game{justify-content:flex-start;padding:6px 6px 8px;gap:5px}
#top{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;font-family:"Lilita One",sans-serif;font-size:20px}
#cw{position:relative;flex:1;min-height:0;width:100%}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:10px;touch-action:none}
#hand{display:flex;gap:7px;width:100%;max-width:420px;align-items:flex-end;padding-top:8px}
.cd{flex:1;position:relative;height:84px;border:3px solid #5b7f8e;border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:0;font-size:11px;gap:2px}
.cd .em{font-size:30px;line-height:1}
.cd .co{position:absolute;top:-9px;left:-7px;width:24px;height:24px;border-radius:50%;background:var(--pur);display:grid;place-items:center;font-family:"Lilita One",sans-serif;font-size:14px;border:2px solid #fff}
.cd.sel{border-color:var(--gold);transform:translateY(-8px)}
.cd.no{opacity:.5}
#nx{width:44px;text-align:center;font-size:10px;color:#9fc0cc}#nx b{display:block;font-size:22px;font-weight:400}
#eb{position:relative;width:100%;max-width:420px;height:22px;border-radius:11px;background:#2a1740;border:2px solid #6a3a8e;overflow:hidden}
#ef{height:100%;width:50%;background:linear-gradient(#e58bff,#a63dd6)}
#et{position:absolute;inset:0;display:grid;place-items:center;font-family:"Lilita One",sans-serif;font-size:15px}
#res{position:absolute;inset:0;background:rgba(5,14,19,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#res.on{display:flex}#res h1{font-size:56px}
</style></head><body>
<div class="scr on" id="menu">
  <h1>Arena Duel</h1>
  <div class="sub">Trimite trupe, apără-ți turnurile și dărâmă turnul rege al adversarului în 2 minute.</div>
  <button class="btn" id="bOn">Meci online</button>
  <button class="btn b" id="bBot">Joacă contra bot</button>
  <div id="stat"></div>
</div>
<div class="scr" id="srch">
  <div class="spin"></div>
  <h1 class="h" style="font-size:30px">Se caută un adversar…</h1>
  <div id="sinfo" style="color:#9fc0cc"></div>
  <button class="btn b" id="bBot2" style="display:none">Joacă contra bot acum</button>
  <button class="btn g" id="bCan">Anulează</button>
</div>
<div class="scr" id="game">
  <div id="top"><span id="cr">🏆 0 : 0</span><span id="tm">2:00</span></div>
  <div id="cw"><canvas id="cv"></canvas></div>
  <div id="eb"><div id="ef"></div><div id="et">5</div></div>
  <div id="hand"></div>
  <div id="res"><h1 id="rt"></h1><div id="rs" style="color:#9fc0cc"></div>
    <button class="btn" id="bAg">Joacă din nou</button><button class="btn g" id="bMn">Meniu</button></div>
</div>
<script>
const W=360,H=520,RY=260,BR=[90,270];
const C=[
{n:'Cavaler',c:3,e:'🛡️',hp:700,d:80,cd:1.1,r:16,s:38,k:1},
{n:'Arcași',c:3,e:'🏹',hp:260,d:42,cd:1,r:92,s:40,k:2},
{n:'Uriaș',c:5,e:'🗿',hp:2000,d:110,cd:1.5,r:18,s:26,k:1,tb:1},
{n:'Goblini',c:2,e:'👺',hp:170,d:52,cd:.7,r:12,s:72,k:3},
{n:'Archebuzier',c:4,e:'🔫',hp:450,d:112,cd:1.1,r:100,s:38,k:1},
{n:'Foc',c:4,e:'🔥',sp:1}];
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function mkTw(){const a=[];[0,1].forEach(t=>{const y0=t?110:410,yk=t?52:468;[[90,y0],[270,y0],[180,yk]].forEach(([x,y],i)=>a.push({t,x,y,k:i==2,hp:i==2?2400:1400,m:i==2?2400:1400,cd:0,st:0}))});return a}
const LAY=mkTw();
let S,V,me=0,flip=false,mode='menu',net=null,hand=[],queue=[],sel=-1,done=false,raf=0,sm={},acc=0,last=0,lobby=null,unsubQ=null,qStart=0,bot={t:2},rematch='bot';

/* ---------- simulare (host / bot) ---------- */
function initSim(){S={u:[],tw:mkTw(),e:[5,5],t:120,fx:[],id:0,o:null};bot={t:2.5}}
function deploy(t,c,x,y){
  const D=C[c];if(!D||S.o!=null||!(x>=0&&x<=W&&y>=0&&y<=H)||S.e[t]<D.c)return false;
  if(D.sp){S.e[t]-=D.c;S.fx.push([x,y,.4]);
    for(const o of S.u)if(o.t!=t&&Math.hypot(o.x-x,o.y-y)<55)o.hp-=330;
    for(const w of S.tw)if(w.t!=t&&w.hp>0&&Math.hypot(w.x-x,w.y-y)<60)w.hp-=160;return true}
  if(t==0?y<RY+15:y>RY-15)return false;
  S.e[t]-=D.c;
  for(let i=0;i<D.k;i++)S.u.push({id:++S.id,c,t,x:x+(i-(D.k-1)/2)*12,y:y+(i%2)*6,hp:D.hp,cd:.5,st:0});
  return true}
function side(y){return y>RY?0:1}
function step(dt){
  if(S.o!=null)return;
  S.t-=dt;for(const t of[0,1])S.e[t]=Math.min(10,S.e[t]+dt/2.4);
  S.fx=S.fx.filter(f=>(f[2]-=dt)>0);
  if(mode=='bot'||(net&&net.bot))botAI(dt);
  for(const u of S.u){
    const D=C[u.c];u.cd-=dt;u.st-=dt;let tg=null,bd=1e9;
    if(!D.tb)for(const o of S.u){if(o.t==u.t)continue;const d=Math.hypot(o.x-u.x,o.y-u.y);if(d<bd&&d<85){bd=d;tg=o}}
    if(!tg)for(const w of S.tw){if(w.t==u.t||w.hp<=0)continue;const d=Math.hypot(w.x-u.x,w.y-u.y);if(d<bd){bd=d;tg=w}}
    if(!tg)continue;
    const isT=tg.m!==undefined,d=Math.hypot(tg.x-u.x,tg.y-u.y);
    if(d<=D.r+(isT?20:6)){
      if(u.cd<=0){u.cd=D.cd;tg.hp-=D.d;u.sx=tg.x;u.sy=tg.y;u.st=.15}
    }else{
      let px=tg.x,py=tg.y;const s=side(u.y),ts=side(tg.y),band=Math.abs(u.y-RY)<=14;
      if(s!=ts||band){
        const bx=Math.abs(u.x-90)<Math.abs(u.x-270)?90:270;
        if(!band&&Math.abs(u.x-bx)>10){px=bx;py=RY+(s==0?24:-24)}else{px=bx;py=RY+(ts==0?24:-24)}
      }
      const dx=px-u.x,dy=py-u.y,l=Math.hypot(dx,dy)||1;
      u.x+=dx/l*D.s*dt;u.y+=dy/l*D.s*dt}
  }
  for(const a of S.u)for(const b of S.u){if(a===b)continue;const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
    if(d<11&&d>0){a.x+=dx/d*(11-d)*.3;a.y+=dy/d*(11-d)*.3}}
  for(const u of S.u)u.x=Math.max(8,Math.min(W-8,u.x));
  for(const w of S.tw){
    if(w.hp<=0)continue;w.cd-=dt;w.st-=dt;if(w.cd>0)continue;
    let tg=null,bd=w.k?110:125;
    for(const o of S.u){if(o.t==w.t)continue;const d=Math.hypot(o.x-w.x,o.y-w.y);if(d<bd){bd=d;tg=o}}
    if(tg){w.cd=.9;tg.hp-=w.k?75:65;w.sx=tg.x;w.sy=tg.y;w.st=.15}
  }
  S.u=S.u.filter(u=>u.hp>0);
  if(S.tw[2].hp<=0)S.o=1;else if(S.tw[5].hp<=0)S.o=0;
  else if(S.t<=0){S.t=0;const c0=S.tw.slice(3).filter(w=>w.hp<=0).length,c1=S.tw.slice(0,3).filter(w=>w.hp<=0).length;S.o=c0>c1?0:c1>c0?1:2}
}
function botAI(dt){
  bot.t-=dt;if(bot.t>0)return;bot.t=1.3+Math.random()*1.7;
  const opts=[0,1,2,3,4,5].filter(c=>C[c].c<=S.e[1]);if(!opts.length)return;
  const foe=S.u.filter(u=>u.t==0);let c=opts[Math.random()*opts.length|0],x,y;
  if(C[c].sp){let b=null,n=1;
    for(const u of foe){const m=foe.filter(o=>Math.hypot(o.x-u.x,o.y-u.y)<55).length;if(m>n){n=m;b=u}}
    if(b){deploy(1,c,b.x,b.y);return}
    const np=opts.filter(k=>!C[k].sp);if(!np.length)return;c=np[Math.random()*np.length|0]}
  const th=foe.filter(u=>u.y<RY+30);
  if(th.length){const u=th[0];x=u.x+Math.random()*30-15;y=Math.min(RY-25,Math.max(70,u.y-35))}
  else{x=BR[Math.random()<.5?0:1]+Math.random()*50-25;y=C[c].r>50?150:C[c].tb?110:200}
  deploy(1,c,Math.max(12,Math.min(W-12,x)),y)}
function snap(){return{t:Math.ceil(S.t),e:S.e.map(x=>+x.toFixed(1)),
  w:S.tw.map(w=>[Math.max(0,w.hp|0),w.st>0?w.sx|0:0,w.st>0?w.sy|0:0]),
  u:S.u.map(u=>[u.id,u.c,u.t,u.x|0,u.y|0,u.hp|0,u.st>0?u.sx|0:0,u.st>0?u.sy|0:0]),
  f:S.fx.map(f=>[f[0]|0,f[1]|0,+f[2].toFixed(2)]),o:S.o}}

/* ---------- desen ---------- */
function bar(x,y,w,f,mine){ctx.fillStyle='#000a';ctx.fillRect(x-w/2-1,y-3,w+2,6);ctx.fillStyle=mine?'#4cd964':'#ff5a4f';ctx.fillRect(x-w/2,y-2,w*Math.max(0,f),4)}
function draw(){
  ctx.clearRect(0,0,W,H);
  if(!V||!V.w){ctx.fillStyle='#10222b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText('Se conectează…',W/2,H/2);return}
  const P=(x,y)=>flip?[W-x,H-y]:[x,y],shots=[];
  ctx.fillStyle='#3d7a46';ctx.fillRect(0,0,W,H);ctx.fillStyle='#468a50';for(let i=1;i<13;i+=2)ctx.fillRect(0,i*40,W,40);
  ctx.fillStyle='#2f86c4';ctx.fillRect(0,RY-14,W,28);ctx.fillStyle='rgba(255,255,255,.3)';
  for(let x=10;x<W;x+=46)ctx.fillRect(x+(performance.now()/90%20),RY-6+(x%3)*5,16,2);
  for(const b of BR){ctx.fillStyle='#9b7a46';ctx.fillRect(b-20,RY-18,40,36);ctx.fillStyle='#7a5c30';for(let k=-14;k<18;k+=7)ctx.fillRect(b-20,RY+k,40,1.5)}
  const c0=sel>=0?C[hand[sel]]:null;
  if(c0){ctx.fillStyle=c0.sp?'rgba(255,120,40,.1)':'rgba(255,255,255,.12)';c0.sp?ctx.fillRect(0,0,W,H):ctx.fillRect(0,RY+15,W,H-RY-15)}
  ctx.textAlign='center';ctx.textBaseline='middle';
  LAY.forEach((L,i)=>{const w=V.w[i],[x,y]=P(L.x,L.y),mine=L.t==me,s=L.k?22:17;
    if(w[0]<=0){ctx.fillStyle='#5a5a5a';ctx.fillRect(x-s,y-s*.4,s*2,s*.8);return}
    ctx.fillStyle=mine?'#3c8fd9':'#d6453f';ctx.fillRect(x-s,y-s,s*2,s*2);
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.strokeRect(x-s,y-s,s*2,s*2);
    ctx.font=(L.k?28:22)+'px serif';ctx.fillText(L.k?'👑':'🏰',x,y+1);
    bar(x,y-s-7,32,w[0]/L.m,mine);if(w[1])shots.push([x,y,...P(w[1],w[2])])});
  const ns={};
  for(const u of V.u){const D=C[u[1]];if(!D)continue;let[x,y]=P(u[3],u[4]);
    if(net&&!net.host){const p=sm[u[0]]||[x,y];p[0]+=(x-p[0])*.35;p[1]+=(y-p[1])*.35;ns[u[0]]=p;x=p[0];y=p[1]}
    const mine=u[2]==me;ctx.fillStyle=mine?'rgba(60,143,217,.9)':'rgba(214,69,63,.9)';
    ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    ctx.font='14px serif';ctx.fillText(D.e,x,y+1);if(u[5]<D.hp)bar(x,y-14,16,u[5]/D.hp,mine);
    if(u[6])shots.push([x,y,...P(u[6],u[7])])}
  sm=ns;
  ctx.strokeStyle='#ffe27a';ctx.lineWidth=2;for(const s of shots){ctx.beginPath();ctx.moveTo(s[0],s[1]);ctx.lineTo(s[2],s[3]);ctx.stroke()}
  for(const f of V.f){const[x,y]=P(f[0],f[1]),k=1-f[2]/.4;ctx.fillStyle=`rgba(255,${140+k*80|0},40,${.75-k*.4})`;ctx.beginPath();ctx.arc(x,y,55*(.4+k*.6),0,7);ctx.fill()}
}

/* ---------- mână & intrare ---------- */
function newHand(){const a=[0,1,2,3,4,5].sort(()=>Math.random()-.5);hand=a.slice(0,4);queue=a.slice(4);sel=-1;renderHand()}
function renderHand(){
  $('hand').innerHTML=hand.map((c,i)=>`<button class="cd" data-i="${i}"><span class="co">${C[c].c}</span><span class="em">${C[c].e}</span>${C[c].n}</button>`).join('')+`<div id="nx">Urmează<b>${C[queue[0]].e}</b></div>`;
  $('hand').querySelectorAll('.cd').forEach(b=>b.onpointerdown=e=>{e.preventDefault();const i=+b.dataset.i;sel=sel==i?-1:i;syncCards()})}
function syncCards(){const e=V&&V.e?V.e[me]:0;$('hand').querySelectorAll('.cd').forEach((b,i)=>{b.classList.toggle('sel',i==sel);b.classList.toggle('no',C[hand[i]].c>e)})}
cv.addEventListener('pointerdown',ev=>{
  if(sel<0||!V||!V.w||V.o!=null)return;
  const r=cv.getBoundingClientRect();let x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H;
  if(flip){x=W-x;y=H-y}
  const c=hand[sel],D=C[c];if(V.e[me]<D.c)return;
  if(!D.sp&&(me==0?y<RY+15:y>RY-15))return;
  let ok=true;
  if(net&&!net.host){V.e[me]-=D.c;net.room.emit('dp',{c,x:x|0,y:y|0})}else ok=deploy(me,c,x,y);
  if(!ok)return;
  hand[sel]=queue.shift();queue.push(c);sel=-1;renderHand();syncCards()});

/* ---------- ciclu de joc ---------- */
function fit(){const r=$('cw').getBoundingClientRect(),s=Math.min(r.width/W,r.height/H),d=window.devicePixelRatio||1;
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=W*s*d|0;cv.height=H*s*d|0;ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0)}
addEventListener('resize',()=>{if(mode=='bot'||mode=='net')fit()});
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==id))}
function startGame(team){
  me=team;flip=team==1;done=false;sm={};acc=0;$('res').classList.remove('on');newHand();show('game');fit();last=performance.now();
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function loop(now){
  if(mode!='bot'&&mode!='net')return;
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!net||net.host){step(dt);V=snap();
    if(net){acc+=dt;if(acc>=.1){acc=0;net.room.emit('st',V).catch(()=>{})}}}
  draw();
  if(V&&V.w){
    const mine=V.w.slice(me*3,me*3+3),foe=V.w.slice((1-me)*3,(1-me)*3+3);
    $('cr').textContent='🏆 '+foe.filter(w=>w[0]<=0).length+' : '+mine.filter(w=>w[0]<=0).length;
    $('tm').textContent=Math.floor(V.t/60)+':'+String(V.t%60).padStart(2,'0');
    $('ef').style.width=V.e[me]*10+'%';$('et').textContent=Math.floor(V.e[me]);syncCards();
    if(V.o!=null&&!done){done=true;endGame(V.o)}}
  raf=requestAnimationFrame(loop)}
function endGame(w){
  const win=w==me;$('rt').textContent=w==2?'Egalitate':win?'Victorie!':'Înfrângere';
  $('rt').style.color=w==2?'#fff':win?'var(--gold)':'#ff6b64';
  const mine=V.w.slice(me*3,me*3+3).filter(x=>x[0]<=0).length,foe=V.w.slice((1-me)*3,(1-me)*3+3).filter(x=>x[0]<=0).length;
  $('rs').textContent='Turnuri dărâmate: tu '+foe+', adversar '+mine;$('res').classList.add('on')}
function leaveNet(){if(net){try{net.room.leave()}catch(e){}net=null}}

/* ---------- bot / online ---------- */
function startBot(){leaveNet();stopQ();mode='bot';rematch='bot';initSim();V=snap();startGame(0)}
function stopQ(){if(unsubQ){unsubQ();unsubQ=null}if(lobby)lobby.presence({q:null}).catch(()=>{})}
function findMatch(){
  if(!lobby)return;leaveNet();mode='q';rematch='on';show('srch');qStart=Date.now();
  const id=Math.random().toString(36).slice(2,8);$('bBot2').style.display='none';
  lobby.presence({q:{id,t:qStart}}).catch(()=>{});
  unsubQ=lobby.onPeers(ch=>{
    if(mode!='q')return;
    const l=ch.peers.filter(p=>p.presence&&p.presence.q&&typeof p.presence.q.id=='string').map(p=>p.presence.q)
      .sort((a,b)=>a.t-b.t||(a.id<b.id?-1:1)),i=l.findIndex(q=>q.id==id),o=l[i^1];
    $('sinfo').textContent='Jucători în coadă: '+l.length;
    if(i>=0&&o){const ids=[id,o.id].sort();mode='joining';stopQ();enterRoom('m-'+ids[0]+'-'+ids[1],id==ids[0])}});
  const tick=()=>{if(mode!='q')return;const s=(Date.now()-qStart)/1000|0;
    if(s>=10)$('bBot2').style.display='';setTimeout(tick,1000)};tick()}
async function enterRoom(name,host){
  let room;try{room=await lobby.join(name)}catch(e){return findMatch()}
  const t0=Date.now();
  while(room.peers().length<2){if(mode!='joining'){room.leave();return}
    if(Date.now()-t0>8000){room.leave();return findMatch()}await sleep(200)}
  if(mode!='joining'){room.leave();return}
  net={room,host};mode='net';
  if(host){initSim();room.on('dp',m=>{if(!m.isMe&&m.data&&S)deploy(1,m.data.c|0,+m.data.x,+m.data.y)})}
  else{V=null;room.on('st',m=>{if(!m.isMe&&m.data&&Array.isArray(m.data.w)&&Array.isArray(m.data.u))V=m.data})}
  room.onPeers(ch=>{if(ch.left.length&&!done&&net&&net.room===room){
    if(host&&S)S.o=0;else if(V){V.o=1}}});
  startGame(host?0:1)}
$('bBot').onclick=startBot;$('bBot2').onclick=startBot;
$('bOn').onclick=findMatch;
