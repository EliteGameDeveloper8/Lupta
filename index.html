function mkTw(){const a=[];[0,1].forEach(t=>{const y0=t?110:410,yk=t?52:468;[[90,y0],[270,y0],[180,yk]].forEach(([x,y],i)=>a.push({t,x,y,k:i==2,hp:i==2?2400:1400,m:i==2?2400:1400,cd:0,tg:null}))});return a}

function initSim(){S={u:[],tw:mkTw(),e:[5,5],t:120,ev:[],pd:[],id:0,o:null};const b=shuf(BD[Math.random()*BD.length|0]);bot={t:2.2,h:b.slice(0,4),q:b.slice(4),go:6.5+Math.random()*2}}
/* zone de plasare: jumătatea ta + "buzunarul" din culoarul în care ai dărâmat turnul inamic (până la locul turnului) */
function zones(t,hp){
  const z=[t==0?[0,RY+15,W,H-RY-15]:[0,0,W,RY-15]];

  const n=document.createElement('div');n.id='nx';n.innerHTML='Urm.<canvas width="56" height="56"></canvas>';h.appendChild(n);icon(n.querySelector('canvas'),queue[0]);syncSel()}
addEventListener('pointermove',e=>{ptr=toC(e)});
addEventListener('pointerup',e=>{if(dr){const p=toC(e);if(Math.hypot(e.clientX-dr.x,e.clientY-dr.y)>14&&p)play(dr.i,p);dr=null}if(e.pointerType=='touch')ptr=null});
addEventListener('pointercancel',()=>{dr=null});
cv.addEventListener('pointerdown',e=>{if(sel>=0){const p=toC(e);if(p)play(sel,p)}});
function play(i,p){const c=hand[i],D=C[c];if(!V||V.o!=null||!D)return;
  if(V.e[me]<D.c){sel=-1;syncSel();return}
  let x=p.x,y=p.y;if(flip){x=W-x;y=H-y}
  if(!D.sp&&!canPut(me,x,y,i=>V.w[i][0]))return;
  if(mode=='client'){try{net.send({c,x,y})}catch(e){return}}else if(!deploy(me,c,x,y))return;
  hand[i]=queue.shift();queue.push(c);sel=-1;renderHand()}
function ui(){let a=0,b=0;LAY.forEach((L,i)=>{if(V.w[i][0]<=0){L.t==me?b++:a++}});
  $('cr').textContent='★ '+a+' : '+b;$('tm').textContent=Math.floor(V.t/60)+':'+String(V.t%60).padStart(2,'0');
  $('ef').style.width=V.e[me]*10+'%';$('et').textContent=Math.floor(V.e[me]);
  $('hand').querySelectorAll('.cd').forEach((el,i)=>el.classList.toggle('no',V.e[me]<C[hand[i]].c))}
function fin(t,s){$('rt').textContent=t;$('rs').textContent=s;$('res').classList.add('on')}
function loop(t){
  raf=requestAnimationFrame(loop);
  const dt=Math.min(.1,(t-last)/1000||0);last=t;
  if(mode=='bot'||mode=='host'){acc+=dt;while(acc>=1/30){step(1/30);acc-=1/30}V=snap();
    if(mode=='host'&&net&&(t-lastSend>66||V.o!=null&&!done)){lastSend=t;try{net.send(V)}catch(e){}}}
  if(V&&V.w){ui();if(V.o!=null&&!done){done=true;fin(V.o==2?'Egalitate':V.o==me?'Victorie!':'Înfrângere',$('cr').textContent)}}
  draw()}
function begin(){cancelAnimationFrame(raf);done=false;sm={};V=null;sel=-1;ptr=null;dr=null;acc=0;last=performance.now();lastSend=0;rem=mode=='bot'?'bot':'on';
  if(mode!='client')initSim();
  const b=shuf(deck);hand=b.slice(0,4);queue=b.slice(4);
  $('res').classList.remove('on');show('game');renderHand();requestAnimationFrame(fit);raf=requestAnimationFrame(loop)}
function closeNet(){qTok++;peers.forEach(p=>{try{p.destroy()}catch(e){}});peers=[];net=null}
function toMenu(){cancelAnimationFrame(raf);closeNet();mode='menu';show('menu')}
function startBot(){closeNet();mode='bot';me=0;flip=false;begin()}
function gone(tok){if(tok==qTok&&mode!='bot'&&!done){done=true;fin('Adversarul a ieșit','Ai câștigat prin abandon')}}
function online(){
  if(!window.Peer){$('stat').textContent='Online indisponibil acum. Poți juca contra bot.';return}
  closeNet();mode='menu';const tok=qTok;show('srch');$('sinfo').textContent='';$('bBot2').style.display='none';
  setTimeout(()=>{if(tok==qTok&&!net){$('bBot2').style.display='';$('sinfo').textContent='Încă nu a apărut nimeni. Poți aștepta sau juca contra bot.'}},8000);
  lobby(tok,0)}
function lobby(tok,i){
  if(tok!=qTok)return;
  if(i>5){$('sinfo').textContent='Niciun adversar disponibil acum.';$('bBot2').style.display='';return}
  let p;try{p=new Peer(LB+i)}catch(e){$('sinfo').textContent='Conexiune indisponibilă.';$('bBot2').style.display='';return}
  peers.push(p);
  p.on('connection',c=>{
    if(net||tok!=qTok){c.on('open',()=>c.close());return}
    net=c;
    c.on('open',()=>{if(tok==qTok){mode='host';me=0;flip=false;begin()}});
    c.on('data',d=>{if(S&&d&&C[d.c]&&S.o==null)deploy(1,d.c,+d.x,+d.y)});
    c.on('close',()=>gone(tok))});
  p.on('error',e=>{if(tok!=qTok)return;
    if(e.type=='unavailable-id'){try{p.destroy()}catch(x){}
      const q=new Peer();peers.push(q);
      q.on('open',()=>{const c=q.connect(LB+i,{reliable:true});
        const to=setTimeout(()=>{if(tok==qTok&&!net){try{q.destroy()}catch(x){}lobby(tok,i+1)}},3500);
        c.on('open',()=>{if(tok!=qTok)return;clearTimeout(to);net=c;mode='client';me=1;flip=true;begin()});
        c.on('data',d=>{V=d;vt=performance.now()});
        c.on('close',()=>gone(tok))});
      q.on('error',()=>{if(tok==qTok&&!net)lobby(tok,i+1)})}
    else if(e.type!='peer-unavailable'){$('sinfo').textContent='Eroare de conexiune ('+e.type+').';$('bBot2').style.display=''}})}

/* ---------- deck: carduri extensibile cu raritate și statistici ---------- */
const RAR=[['Comună','#8a9ba5'],['Rară','#f08a3c'],['Epică','#b04ae0'],['Legendară','#37d6e6']];
const spdL=s=>s<=30?'Lentă':s<=45?'Medie':s<=60?'Rapidă':'Foarte rapidă';
function stats(D){
  if(D.sp){const a=[['Tip','Vrajă'],['Rază zonă',(D.sr/20).toFixed(1)+' pătr.']];
    if(D.heal)a.push(['Vindecare',D.heal+' viață']);else{a.push(['Daune trupe',D.sd],['Daune turnuri',D.td]);if(D.bolt)a.push(['Lovește','Cele 3 ținte mai puternice']);if(D.fz)a.push(['Îngheață',D.fz+'s'])}
    a.push(['Ținte',D.heal?'Doar aliați':'Sol și aer']);return a}
  const a=[['Tip',D.b?'Clădire':D.sup?'Suport':'Trupă']];
  if(D.k>1)a.push(['Unități',D.k]);
  a.push(['Viață',D.hp]);if(!D.nat)a.push(['Daune/atac',D.d],['Viteză atac',D.cd+'s'],['Daune/sec',Math.round(D.d/D.cd)],['Rază',D.r<=20?'Corp la corp':(D.r/20).toFixed(1)+' pătr.']);if(D.spw)a.push(['Produce',C[D.spw].n+' / '+D.spt+'s']);
  if(D.s)a.push(['Viteză',spdL(D.s)],['Mișcare',D.ar?'Aer':'Sol']);
  if(!D.nat)a.push(['Ținte',D.tb?'Doar clădiri':D.ta?'Sol și aer':'Doar sol']);
  if(D.pj)a.push(['Proiectil',D.pj]);
  if(D.sa)a.push(['Zonă atac',(D.sa/20).toFixed(1)+' pătr.']);
  if(D.hl)a.push(['Vindecare',D.hl+'/s']);
  if(D.life)a.push(['Durată',D.life+'s']);
  return a}
/* previzualizare: mini-arenă cu simularea reală, doar cartea aleasă contra unor trupe de bătut */
let pv=null,pvRaf=0,pvLast=0;
function pvAdd(t,k,x,y,n){const E=C[k],m=n||E.k;for(let i=0;i<m;i++)S.u.push({id:++S.id,c:k,t,x:x+(i-(m-1)/2)*12,y:y+(i%2)*6,hp:E.hp,cd:.5,tg:null,lk:0,br:null,fl:null})}
function pvReset(){
  const c=dview,D=C[c];S={u:[],tw:mkTw(),e:[10,10],t:9999,ev:[],pd:[],id:0,o:null,pv:1};
  S.tw.forEach(w=>{w.hp=w.m=1e9});pv={c,t:0,z:0,a:0,x:0,cv:pv&&pv.cv};
  const foes=D.sp?(c==34?[0,6]:[7,3]):D.tb?[14]:D.b?(D.ta?[26,7]:[0,7]):D.c>=5?[0,6]:D.c>=3?[3,7]:[7];
  foes.forEach((k,i)=>pvAdd(1,k,180+(i-(foes.length-1)/2)*(D.sp?30:50),(D.tb?375:330)-i*6,D.c<=1&&!D.sp&&!D.b?1:0));
  if(D.sp){if(D.heal){pvAdd(0,0,170,405);pvAdd(0,6,200,420);S.u.forEach(u=>{if(u.t==0)u.hp*=.3})}}
  else{pvAdd(0,c,180,D.b?425:440);if(D.sup)pvAdd(0,0,180,408)}}
function pvStep(dt){
  pv.t+=dt;S.e=[10,10];const D=C[pv.c];
  if(D.sp&&!pv.x&&pv.t>(D.heal?1.3:.9)){pv.x=1;const sd=D.heal?0:1,l=S.u.filter(u=>u.t==sd&&!C[u.c].b);
    if(l.length)deploy(0,pv.c,l.reduce((a,u)=>a+u.x,0)/l.length,l.reduce((a,u)=>a+u.y,0)/l.length+(sd?22:-8))}
  step(dt);pv.z=S.u.some(u=>u.t==1)?0:pv.z+dt;
  if(pv.t>8.5||pv.z>1.3)pvReset()}
function pvDraw(){
  const g=pv.cv.getContext('2d'),o=ctx,now=performance.now()/1000;ctx=g;
  g.setTransform(2,0,0,2,-60,-580);
  g.fillStyle='#3d7a46';g.fillRect(30,290,300,200);g.fillStyle='#468a50';for(let i=7;i<13;i+=2)g.fillRect(30,i*40,300,40);
  [[90,410,17],[270,410,17],[180,468,22]].forEach(([x,y,s])=>{g.fillStyle='#2f7fd0';g.fillRect(x-s,y-s,s*2,s*2);g.fillStyle='#6ab0f5';for(let q=-1;q<2;q++)g.fillRect(x+q*s*.7-3,y-s-4,6,5);g.fillStyle='#1a1a1a';g.fillRect(x-4,y-2,8,s)});
  for(const u of S.u.slice().sort((a,b)=>a.y-b.y)){const D=C[u.c],z=(D.k>1?.82:1)*Z[u.c],yo=D.ar?8:0;
    mdl(g,u.c,u.x,u.y-yo,z,u.t?1:0,now+u.id);if(u.fz>0){g.fillStyle='rgba(150,220,255,.45)';g.fillRect(u.x-9,u.y-yo-14,18,24)}
    if(u.hp<D.hp||D.life)bar(u.x,u.y-yo-15*z-3,18,u.hp/D.hp,u.t==0)}
  for(const e of S.ev)drawEv(e,(x,y)=>[x,y],0);
  ctx=o}
function pvLoop(t){
  const c=$('dg').querySelector('.pv');
  if(!c||!$('deck').classList.contains('on')||dview<0){pvRaf=0;return}
  pvRaf=requestAnimationFrame(pvLoop);
  const dt=Math.min(.1,(t-pvLast)/1000||0);pvLast=t;
  if(!pv||pv.c!=dview)pvReset();
  pv.cv=c;pv.a+=dt;while(pv.a>=1/30){pvStep(1/30);pv.a-=1/30}
  pvDraw()}
function renderDeck(){
  const card=i=>{const D=C[i];return '<div class="dc'+(dsel.includes(i)?' in':'')+(dview==i?' cur':'')+'" data-i="'+i+'" style="--rc:'+RAR[D.rr][1]+'"><i class="co">'+D.c+'</i><span class="ck">✓</span><div class="dh"><canvas width="96" height="96"></canvas><b>'+D.n+'</b></div></div>'};
  const panel=i=>{const D=C[i],on=dsel.includes(i);return '<div class="dp dd" style="--rc:'+RAR[D.rr][1]+'"><div class="dh"><b>'+D.n+'</b><span class="rb">'+RAR[D.rr][0]+'</span></div><small>'+D.ds+'</small><canvas class="pv" width="600" height="400"></canvas><div class="sg">'+stats(D).map(([a,b])=>'<div><span>'+a+'</span><b>'+b+'</b></div>').join('')+'</div><button class="btn '+(on?'g':'')+'" data-t="'+i+'">'+(on?'Scoate din deck':'Adaugă în deck')+'</button></div>'};
  const sec=(t,a,empty)=>'<div class="dt">'+t+'</div>'+(a.length?a.map((i,j)=>card(i)+((j%3==2||j==a.length-1)&&dview>=0&&a.slice(j-j%3,j+1).includes(dview)?panel(dview):'')).join(''):'<div class="dt dm">'+empty+'</div>');
  $('dg').innerHTML=sec('În deck ('+dsel.length+'/8)',dsel,'Alege 8 cărți din lista de mai jos.')+sec('Restul cărților',C.map((_,i)=>i).filter(i=>!dsel.includes(i)),'Toate cărțile sunt în deck.');
  $('dg').querySelectorAll('.dc').forEach(b=>{icon(b.querySelector('canvas'),+b.dataset.i);
    b.onclick=()=>{const i=+b.dataset.i;dview=dview==i?-1:i;renderDeck();const o=$('dg').querySelector('.dp');if(o)o.scrollIntoView({block:'nearest'})}});
  $('dg').querySelectorAll('[data-t]').forEach(b=>b.onclick=e=>{e.stopPropagation();const i=+b.dataset.t,j=dsel.indexOf(i);if(j>=0)dsel.splice(j,1);else if(dsel.length<8)dsel.push(i);renderDeck();const o=$('dg').querySelector('.dp');if(o)o.scrollIntoView({block:'nearest'})});
  $('dn').textContent=dsel.length+'/8 cărți, elixir mediu '+(dsel.reduce((a,i)=>a+C[i].c,0)/(dsel.length||1)).toFixed(1);$('dSave').disabled=dsel.length!=8;if(dview>=0&&!pvRaf){pvLast=performance.now();pvRaf=requestAnimationFrame(pvLoop)}}
$('bOn').onclick=online;
$('bBot').onclick=startBot;
$('bBot2').onclick=startBot;
$('bCan').onclick=toMenu;
$('bMn').onclick=toMenu;
$('bAg').onclick=()=>rem=='bot'?startBot():online();
$('bDk').onclick=()=>{dsel=deck.slice();dview=-1;pv=null;renderDeck();show('deck')};
$('dBack').onclick=()=>show('menu');
$('dSave').onclick=()=>{if(dsel.length!=8)return;deck=dsel.slice();try{localStorage.setItem('ad_deck',JSON.stringify(deck))}catch(e){}show('menu')};
if(!window.Peer){$('bOn').disabled=true;$('stat').textContent='Online indisponibil (PeerJS nu s-a încărcat). Poți juca contra bot.'}
