<!doctype html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Duel</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#10222b;--card:#1b3a47;--gold:#f6c343;--blue:#4aa3f0;--pur:#b04ae0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
h1,.h{font-family:"Lilita One","Trebuchet MS",sans-serif;font-weight:400;letter-spacing:.02em;margin:0}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.scr.on{display:flex}
button{font:inherit;cursor:pointer}
.btn{font-family:"Lilita One","Trebuchet MS",sans-serif;font-size:22px;padding:14px 28px;border:0;border-radius:14px;color:#2a1c00;background:var(--gold);box-shadow:0 5px 0 #a87d12;min-width:250px}
.btn.b{background:var(--blue);color:#06233d;box-shadow:0 5px 0 #25689f}
.btn.g{background:#37505b;color:#fff;box-shadow:0 5px 0 #243840}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.btn:disabled{opacity:.45}
#menu h1{font-size:clamp(44px,13vw,72px);color:var(--gold);text-shadow:0 4px 0 #7a5a08;line-height:1}
#menu .sub{color:#9fc0cc;max-width:300px;font-size:14px;line-height:1.4}
#stat{font-size:13px;color:#9fc0cc;min-height:18px}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid #2b4b59;border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
#game{justify-content:flex-start;padding:6px 6px 8px;gap:5px}
#top{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;font-family:"Lilita One",sans-serif;font-size:20px}
#cw{position:relative;flex:1;min-height:0;width:100%}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:10px;touch-action:none}
#hand{display:flex;gap:7px;width:100%;max-width:420px;align-items:flex-end;padding-top:8px}
.cd{flex:1;position:relative;height:84px;border:3px solid #5b7f8e;border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:0;font-size:11px;gap:2px;touch-action:none}
.em{font-size:30px;line-height:1}
.co{position:absolute;top:-9px;left:-7px;width:24px;height:24px;border-radius:50%;background:var(--pur);display:grid;place-items:center;font-family:"Lilita One",sans-serif;font-size:14px;border:2px solid #fff}
.cd.sel{border-color:var(--gold);transform:translateY(-8px)}
.cd.no{opacity:.5}
#nx{width:44px;text-align:center;font-size:10px;color:#9fc0cc}#nx b{display:block;font-size:22px;font-weight:400}
#eb{position:relative;width:100%;max-width:420px;height:22px;border-radius:11px;background:#2a1740;border:2px solid #6a3a8e;overflow:hidden}
#ef{height:100%;width:50%;background:linear-gradient(#e58bff,#a63dd6)}
#et{position:absolute;inset:0;display:grid;place-items:center;font-family:"Lilita One",sans-serif;font-size:15px}
#res{position:absolute;inset:0;background:rgba(5,14,19,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#res.on{display:flex}#res h1{font-size:56px}
#deck{justify-content:flex-start;overflow-y:auto;padding-top:24px}
#dg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;width:100%;max-width:440px;padding:8px 6px}
.dc{position:relative;border:3px solid var(--rc,#34505c);border-radius:12px;background:var(--card);color:#fff;padding:16px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;opacity:.6;cursor:pointer}
.dc.in{opacity:1}
.dc.open{grid-column:1/-1;align-items:stretch;text-align:left;opacity:1;padding:16px 10px 10px}
.dh{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}.dh b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:15px}
.dc.open .dh{flex-direction:row;gap:10px}.dc.open .dh b{font-size:20px}
.rb{display:none;margin-left:auto;font-size:11px;padding:2px 8px;border-radius:9px;background:var(--rc)}.dc.open .rb{display:block}
.ck{display:none;position:absolute;top:3px;right:7px;color:var(--gold);font-weight:700}.dc.in .ck{display:block}
.dd{display:none;flex-direction:column;gap:8px}.dc.open .dd{display:flex}
.dd small{color:#b9d2db;font-size:13px;line-height:1.35}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;font-size:12px}.sg div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid #2c4a57;padding-bottom:2px}.sg span{color:#9fc0cc}.sg b{text-align:right}
.dd .btn{font-size:17px;padding:10px;min-width:0}
#dn{font-size:15px;color:#cfe3ea}
</style></head><body>
<div class="scr on" id="menu">
  <h1>Arena Duel</h1>
  <div class="sub">Trimite trupe, apără-ți turnurile și dărâmă turnul rege al adversarului în 2 minute.</div>
  <button class="btn" id="bOn">Meci online</button>
  <button class="btn b" id="bBot">Joacă contra bot</button>
  <button class="btn g" id="bDk">Deck-ul meu</button>
  <div id="stat"></div>
</div>
<div class="scr" id="srch">
  <div class="spin"></div>
  <h1 class="h" style="font-size:30px">Se caută un adversar…</h1>
  <div id="sinfo" style="color:#9fc0cc;max-width:300px"></div>
  <button class="btn b" id="bBot2" style="display:none">Joacă contra bot acum</button>
  <button class="btn g" id="bCan">Anulează</button>
</div>
<div class="scr" id="deck">
  <h1 class="h" style="font-size:34px">Deck-ul meu</h1>
  <div id="dn"></div>
  <div id="dg"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding-bottom:20px">
    <button class="btn" id="dSave" style="min-width:150px">Salvează</button>
    <button class="btn g" id="dBack" style="min-width:150px">Înapoi</button></div>
</div>
<div class="scr" id="game">
  <div id="top"><span id="cr">🏆 0 : 0</span><span id="tm">2:00</span></div>
  <div id="cw"><canvas id="cv"></canvas></div>
  <div id="eb"><div id="ef"></div><div id="et">5</div></div>
  <div id="hand"></div>
  <div id="res"><h1 id="rt"></h1><div id="rs" style="color:#9fc0cc"></div>
    <button class="btn" id="bAg">Joacă din nou</button><button class="btn g" id="bMn">Meniu</button></div>
</div>
<script>
const W=360,H=520,RY=260,BR=[90,270];
const C=[
{n:'Cavaler',an:0,c:3,e:'🛡️',hp:700,d:80,cd:1.1,r:16,s:38,k:1,ta:0,rr:0,ds:'Luptător rezistent la corp la corp. Echilibrat în atac și apărare.'},
{n:'Arcași',an:1,c:3,e:'🏹',hp:260,d:42,cd:1,r:92,s:40,k:2,ta:1,rr:0,pj:'Săgeată',ds:'Doi trăgători fragili care lovesc de la distanță, inclusiv trupe aeriene.'},
{n:'Uriaș',an:10,c:5,e:'🗿',hp:2000,d:110,cd:1.5,r:18,s:26,k:1,tb:1,ta:0,rr:1,ds:'Imens și lent. Ignoră trupele și merge direct la clădiri și turnuri.'},
{n:'Goblini',an:0,c:2,e:'👺',hp:170,d:52,cd:.7,r:12,s:72,k:3,ta:0,rr:0,ds:'Trei luptători foarte rapizi, buni la contraatac.'},
{n:'Archebuzier',an:2,c:4,e:'🔫',hp:450,d:112,cd:1.1,r:100,s:38,k:1,ta:1,rr:1,pj:'Glonț',ds:'Lovește tare de la mare distanță, dar rezistă puțin.'},
{n:'Foc',an:11,c:4,e:'🔥',sp:1,sr:55,sd:330,td:160,rr:1,ds:'Vrajă: explozie în zonă. Rănește tare trupele, mai puțin turnurile.'},
{n:'Barbari',an:0,c:5,e:'🪓',hp:290,d:62,cd:1.3,r:14,s:44,k:3,ta:0,rr:0,ds:'Trei războinici puternici care înaintează împreună.'},
{n:'Schelete',an:0,c:1,e:'💀',hp:55,d:30,cd:1,r:10,s:62,k:3,ta:0,rr:0,ds:'Trei unități ieftine. Bune ca să abată trupele grele.'},
{n:'Vrăjitor',an:3,c:5,e:'🧙',hp:430,d:140,cd:1.4,r:95,s:36,k:1,ta:1,rr:2,pj:'Bilă de foc',sa:28,ds:'Atac puternic în zonă de la distanță. Scump, dar periculos.'},
{n:'Săgeți',an:12,c:3,e:'🎯',sp:1,sr:42,sd:150,td:75,rr:0,ds:'Vrajă ieftină care curăță grupuri de unități slabe.'},
{n:'Bombardier',an:4,c:2,e:'🧨',hp:150,d:100,cd:1.6,r:60,s:40,k:1,ta:0,rr:0,pj:'Bombă',sa:30,ds:'Aruncă bombe care lovesc mai multe trupe de sol deodată.'},
{n:'Dragon',an:5,c:4,e:'🐲',hp:800,d:95,cd:1.5,r:70,s:48,k:1,ta:1,ar:1,rr:2,pj:'Flăcări',sa:28,ds:'Zboară peste râu și scuipă foc care rănește mai multe ținte.'},
{n:'Balon',an:8,c:5,e:'🎈',hp:1100,d:220,cd:2,r:12,s:36,k:1,tb:1,ar:1,ta:0,rr:2,ds:'Zboară direct la clădiri și turnuri. Doar trupele care lovesc aerul îl pot opri.'},
{n:'Vindecător',an:6,c:4,e:'💖',hp:560,d:40,cd:1.2,r:50,s:40,k:1,ta:1,rr:2,pj:'Rază de lumină',hl:45,ds:'Vindecă trupele aliate din apropiere în timp ce înaintează.'},
{n:'Tun',an:7,c:3,e:'⚙️',b:1,hp:650,d:60,cd:.7,r:105,s:0,k:1,ta:0,rr:0,pj:'Ghiulea',life:30,ds:'Clădire defensivă. Trage în trupele de sol, dar dispare după 30 de secunde.'}];
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),shuf=a=>a.slice().sort(()=>Math.random()-.5);
function mkTw(){const a=[];[0,1].forEach(t=>{const y0=t?110:410,yk=t?52:468;[[90,y0],[270,y0],[180,yk]].forEach(([x,y],i)=>a.push({t,x,y,k:i==2,hp:i==2?2400:1400,m:i==2?2400:1400,cd:0,st:0}))});return a}
const LAY=mkTw();
let deck=[0,1,2,3,4,5,7,9];
try{const d=JSON.parse(localStorage.getItem('ad_deck'));if(Array.isArray(d)&&d.length==8&&d.every(i=>C[i]))deck=d}catch(e){}
let S,V,me=0,flip=false,mode='menu',net=null,hand=[],queue=[],sel=-1,done=false,raf=0,sm={},acc=0,last=0,qTok=0,qStart=0,bot={},rematch='bot',ptr=null,drag=null,peers=[];

/* ---------- simulare (host / bot) ---------- */
function initSim(){S={u:[],tw:mkTw(),e:[5,5],t:120,ev:[],pd:[],id:0,o:null};const b=shuf(C.map((_,i)=>i)).slice(0,8);bot={t:2.5,h:b.slice(0,4),q:b.slice(4)}}
function deploy(t,c,x,y){
  const D=C[c];if(!D||S.o!=null||!(x>=0&&x<=W&&y>=0&&y<=H)||S.e[t]<D.c)return false;
  if(D.sp){S.e[t]-=D.c;S.ev.push([D.an,x|0,y|0,x|0,y|0,0,D.sr,t]);S.pd.push([.4,x,y,t,c]);return true}
  if(t==0?y<RY+15:y>RY-15)return false;
  S.e[t]-=D.c;
  for(let i=0;i<D.k;i++)S.u.push({id:++S.id,c,t,x:x+(i-(D.k-1)/2)*12,y:y+(i%2)*6,hp:D.hp,cd:.5,st:0});
  return true}
function side(y){return y>RY?0:1}
function step(dt){
  if(S.o!=null)return;
  S.t-=dt;for(const t of[0,1])S.e[t]=Math.min(10,S.e[t]+dt/2.4);
  S.ev=S.ev.filter(e=>(e[5]+=dt)<ft(e)+TOT[e[0]]);
  S.pd=S.pd.filter(q=>{if((q[0]-=dt)>0)return true;const D=C[q[4]],x=q[1],y=q[2],t=q[3];
    for(const o of S.u)if(o.t!=t&&Math.hypot(o.x-x,o.y-y)<D.sr)o.hp-=D.sd;
    for(const w of S.tw)if(w.t!=t&&w.hp>0&&Math.hypot(w.x-x,w.y-y)<D.sr+5)w.hp-=D.td;return false});
  if(mode=='bot')botAI(dt);
  for(const u of S.u){
    const D=C[u.c];u.cd-=dt;u.st-=dt;let tg=null,bd=1e9;
    if(D.life)u.hp-=D.hp/D.life*dt;
    if(D.hl){u.hc=(u.hc||0)-dt;let n=0;for(const o of S.u)if(o.t==u.t&&o!==u&&Math.hypot(o.x-u.x,o.y-u.y)<70){const m=C[o.c].hp;if(o.hp<m){o.hp=Math.min(m,o.hp+D.hl*dt);if(u.hc<=0&&n++<2)S.ev.push([6,u.x|0,u.y|0,o.x|0,o.y|0,0,1,u.t])}}if(u.hc<=0)u.hc=.7}
    for(const o of S.u){const OD=C[o.c];if(o.t==u.t||(D.tb&&!OD.b)||(OD.ar&&!D.ta))continue;const d=Math.hypot(o.x-u.x,o.y-u.y);if(d<bd&&d<Math.max(85,D.r)){bd=d;tg=o}}
    if(!tg)for(const w of S.tw){if(w.t==u.t||w.hp<=0)continue;const d=Math.hypot(w.x-u.x,w.y-u.y);if(d<bd){bd=d;tg=w}}
    if(!tg)continue;
    const isT=tg.m!==undefined,d=Math.hypot(tg.x-u.x,tg.y-u.y);
    if(d<=D.r+(isT?20:6)){
      if(u.cd<=0){u.cd=D.cd;tg.hp-=D.d;S.ev.push([D.an,u.x|0,u.y|0,tg.x|0,tg.y|0,0,D.sa||(D.an==10?30:20),u.t]);if(D.sa)for(const o of S.u)if(o.t!=u.t&&o!==tg&&Math.hypot(o.x-tg.x,o.y-tg.y)<D.sa&&(!C[o.c].ar||D.ta))o.hp-=D.d}
    }else if(D.s){
      let px=tg.x,py=tg.y;const s=side(u.y),ts=side(tg.y),band=Math.abs(u.y-RY)<=14;
      if(!D.ar&&(s!=ts||band)){
        const bx=Math.abs(u.x-90)<Math.abs(u.x-270)?90:270;
        if(!band&&Math.abs(u.x-bx)>10){px=bx;py=RY+(s==0?24:-24)}else{px=bx;py=RY+(ts==0?24:-24)}
      }
      const dx=px-u.x,dy=py-u.y,l=Math.hypot(dx,dy)||1;
      u.x+=dx/l*D.s*dt;u.y+=dy/l*D.s*dt}
  }
  for(const a of S.u)for(const b of S.u){if(a===b||!C[a.c].s)continue;const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
    if(d<11&&d>0){a.x+=dx/d*(11-d)*.3;a.y+=dy/d*(11-d)*.3}}
  for(const u of S.u)u.x=Math.max(8,Math.min(W-8,u.x));
  for(const w of S.tw){
    if(w.hp<=0)continue;w.cd-=dt;w.st-=dt;if(w.cd>0)continue;
    let tg=null,bd=w.k?110:125;
    for(const o of S.u){if(o.t==w.t)continue;const d=Math.hypot(o.x-w.x,o.y-w.y);if(d<bd){bd=d;tg=o}}
    if(tg){w.cd=.9;tg.hp-=w.k?75:65;S.ev.push([w.k?7:1,w.x|0,w.y|0,tg.x|0,tg.y|0,0,20,w.t])}
  }
  S.u=S.u.filter(u=>u.hp>0);
  if(S.tw[2].hp<=0)S.o=1;else if(S.tw[5].hp<=0)S.o=0;
  else if(S.t<=0){S.t=0;const c0=S.tw.slice(3).filter(w=>w.hp<=0).length,c1=S.tw.slice(0,3).filter(w=>w.hp<=0).length;S.o=c0>c1?0:c1>c0?1:2}
}
/* botul are deck de 8 cărți, mână de 4 și același elixir ca tine */
function bplay(c,x,y){if(!deploy(1,c,Math.max(12,Math.min(W-12,x)),y))return false;
  const i=bot.h.indexOf(c);bot.h[i]=bot.q.shift();bot.q.push(c);return true}
function botAI(dt){
  bot.t-=dt;if(bot.t>0)return;bot.t=1.2+Math.random()*1.8;
  const opts=bot.h.filter(c=>C[c].c<=S.e[1]);if(!opts.length)return;
  const foe=S.u.filter(u=>u.t==0);let c=opts[Math.random()*opts.length|0],x,y;
  if(C[c].sp){let b=null,n=1;
    for(const u of foe){const m=foe.filter(o=>Math.hypot(o.x-u.x,o.y-u.y)<C[c].sr).length;if(m>n){n=m;b=u}}
    if(b){bplay(c,b.x,b.y);return}
    const np=opts.filter(k=>!C[k].sp);if(!np.length)return;c=np[Math.random()*np.length|0]}
  const th=foe.filter(u=>u.y<RY+30);
  if(th.length){const u=th[0];x=u.x+Math.random()*30-15;y=Math.min(RY-25,Math.max(70,u.y-35))}
  else{x=BR[Math.random()<.5?0:1]+Math.random()*50-25;y=C[c].r>50?150:C[c].tb?110:200}
  bplay(c,x,y)}
const TOT={0:.28,1:.12,2:.1,3:.35,4:.38,5:.4,6:.35,7:.35,8:.38,10:.4,11:.45,12:.3};
function ft(e){const k=e[0],d=Math.hypot(e[3]-e[1],e[4]-e[2]);return k==1?Math.max(.1,d/320):k==2?.07:k==3?Math.max(.15,d/230):k==4?Math.max(.25,d/200):k==7?Math.max(.15,d/380):k==8?.3:k>10?.4:0}
function snap(){return{t:Math.ceil(S.t),e:S.e.map(x=>+x.toFixed(1)),
  w:S.tw.map(w=>[Math.max(0,w.hp|0)]),
  u:S.u.map(u=>[u.id,u.c,u.t,u.x|0,u.y|0,u.hp|0]),
  a:S.ev.map(e=>e.map((v,i)=>i==5?+v.toFixed(2):v)),o:S.o}}

/* ---------- desen ---------- */
function bar(x,y,w,f,mine){ctx.fillStyle='#000a';ctx.fillRect(x-w/2-1,y-3,w+2,6);ctx.fillStyle=mine?'#4cd964':'#ff5a4f';ctx.fillRect(x-w/2,y-2,w*Math.max(0,f),4)}
function drawEv(e,P,ex){
  const k=e[0],[x1,y1]=P(e[1],e[2]),[x2,y2]=P(e[3],e[4]),s=e[6]||20,f=ft(e),t=e[5]+ex,p=f?Math.min(1,t/f):1,r=Math.min(1,Math.max(0,t-f)/TOT[k]);
  const lx=x1+(x2-x1)*p,ly=y1+(y2-y1)*p,an=Math.atan2(y2-y1,x2-x1),cs=Math.cos(an),sn=Math.sin(an);
  ctx.save();ctx.lineCap='round';
  const dot=(x,y,rad,col,a)=>{ctx.globalAlpha=Math.max(0,a);ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,Math.max(.1,rad),0,7);ctx.fill()};
  const spark=(x,y)=>{ctx.globalAlpha=1-r;ctx.strokeStyle='#fff3b0';ctx.lineWidth=2;for(let i=0;i<6;i++){const a=i*1.05+.3;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*(3+r*4),y+Math.sin(a)*(3+r*4));ctx.lineTo(x+Math.cos(a)*(6+r*9),y+Math.sin(a)*(6+r*9));ctx.stroke()}};
  const boom=(x,y,R)=>{dot(x,y,R*(.6+.8*r),'#ff6a1a',.8*(1-r));dot(x,y,R*(.3+.5*r),'#ffe08a',.9*(1-r));spark(x,y)};
